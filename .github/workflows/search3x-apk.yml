name: Search3x APK

# 目的：只编一个能装的 APK，供主人在手机上验证「换源搜索并发 9→27」的效果。
# 不跑测试、不做签名变更、不碰 release.yml 等原有工作流。

on:
  push:
    branches: [ search3x ]      # 只在本分支推送时触发，不干扰上游其它 CI
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write               # 发 Release 需要

concurrency:
  group: search3x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # 与 gradle.properties 的 JVM 设置匹配

      - uses: android-actions/setup-android@v3

      # 项目 compileSdk=37 / AGP 9.4.1：按工程实际需要装平台与构建工具
      - name: Install SDK platform
        run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;3.22.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan                     # KMP 的 native 工具链缓存
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Xmx6g -Dorg.gradle.daemon=false"
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          echo "=== 产物 ==="
          find app/build/outputs -name '*.apk'

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -f "$APK" || { echo "没有找到 APK"; exit 1; }
          NAME="legado-search3x-debug.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum "$NAME" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: legado-search3x-debug
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      # 同步发到 Release，主人可以直接拿免登录直链下载
      - name: Publish Release asset
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/search3x'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: search3x-debug
          name: legado 搜索并发 9→27（debug 包）
          draft: false
          prerelease: true
          body: |
            书源搜索并发上限 9 → 27（`AppConst.MAX_SEARCH_THREAD`）。

            - 只改并发闸门，单源请求/解析/过滤/排序逻辑未动（质量不变）
            - 调试签名：安装前需卸载已装的正式版，或换包名共存
            - commit: ${{ github.sha }}
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true